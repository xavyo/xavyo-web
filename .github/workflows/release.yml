name: Release

# Single path: merge to main → build → push GHCR → deploy Koyeb prod.
# Manual GitHub Releases still work (same job) using the release tag as version.
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/xavyo-web
  KOYEB_APP_SERVICE: xavyo-web/web
  KOYEB_REGISTRY_SECRET: ghcr

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            # YYYY.MM.DD.<run_number> — unique per main push / dispatch
            VERSION="$(date -u +%Y.%m.%d).${{ github.run_number }}"
          fi
          SHORT_SHA="$(echo "${{ github.sha }}" | cut -c1-7)"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Image version=${VERSION} sha=${SHORT_SHA}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.short_sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Koyeb
        env:
          KOYEB_TOKEN: ${{ secrets.KOYEB_API_TOKEN }}
        run: |
          if [ -z "$KOYEB_TOKEN" ]; then
            echo "::error::Missing secret KOYEB_API_TOKEN — set it in repo Settings → Secrets"
            exit 1
          fi
          curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
          export PATH="$HOME/.koyeb/bin:$PATH"
          # Keep org pull secret `ghcr` fresh for private GHCR pulls (not ghcr-registry).
          koyeb secrets update "${{ env.KOYEB_REGISTRY_SECRET }}" \
            --registry-url ghcr.io \
            --registry-username "${{ github.actor }}" \
            -v "${{ secrets.GITHUB_TOKEN }}" 2>/dev/null || \
          koyeb secrets create "${{ env.KOYEB_REGISTRY_SECRET }}" --type registry-private \
            --registry-url ghcr.io \
            --registry-username "${{ github.actor }}" \
            -v "${{ secrets.GITHUB_TOKEN }}"
          koyeb services update "${{ env.KOYEB_APP_SERVICE }}" \
            --docker "ghcr.io/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}" \
            --docker-private-registry-secret "${{ env.KOYEB_REGISTRY_SECRET }}" \
            --min-scale 1
